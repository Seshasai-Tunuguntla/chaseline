name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q -m "not data"
      - name: Pipeline smoke run on the committed sample
        run: python -m chaseline.run --smoke --out "$RUNNER_TEMP/site-data" --db "$RUNNER_TEMP/smoke.duckdb"
